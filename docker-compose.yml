
services:
  postgres-db:
    image: postgres:16
    container_name: studygen-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: StudyGen123
      POSTGRES_DB: studygen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: