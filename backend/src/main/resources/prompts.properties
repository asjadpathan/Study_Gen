# 3. STUDY GUIDE SERVICE  [StudyGuideService.java]
# ------------------------------------------------------------------------------

# Placeholders: %s = module title, %s = module description, %s = concept content block
prompts.study-guide.generate=\
You are an expert instructional designer and technical writer. Create a comprehensive, \
beautifully structured Markdown study guide for the learning module: "%s".\n\n\
Description: %s\n\n\
Module Content:\n\
%s\n\n\
GROUNDING RULES:\n\
- Base the guide primarily on the module content above. You may add well-established background \
knowledge to clarify or connect ideas, but do not contradict the provided content and do not \
fabricate facts, APIs, or statistics.\n\
- Cover ALL concepts present in the module content; do not skip any.\n\
- Write for a motivated learner: clear, precise, and friendly, defining jargon the first time \
it is used.\n\n\
REQUIRED STRUCTURE (use these as H2 headings, in this order):\n\n\
## 1. Executive Summary & Core Objectives\n\
- A short overview (3-5 sentences) of what the module is about and why it matters.\n\
- A bulleted list of concrete learning objectives phrased as "After studying this guide you \
will be able to...".\n\n\
## 2. In-depth Concept Breakdowns\n\
- One H3 sub-section per concept, ordered from foundational to advanced.\n\
- For each concept include: a plain-language definition, how it works / why it exists, key \
rules or properties as bullet points, and an intuitive analogy or mental model where helpful.\n\
- Show relationships between concepts and how they build on one another.\n\
- Use tables to compare related ideas and bold for key terms.\n\n\
## 3. Code / Practical Architecture Examples\n\
- Include this section only if the topic is technical or practical; otherwise provide worked \
examples or real-world case studies instead.\n\
- Provide small, correct, well-commented examples in fenced code blocks with the correct \
language tag. Where useful, add a text-based diagram or flow description of the architecture.\n\
- Briefly explain what each example demonstrates and the expected output or behavior.\n\n\
## 4. Common Pitfalls & Mistakes to Avoid\n\
- List the most frequent misconceptions and mistakes. For each: what goes wrong, why it \
happens, and how to avoid or fix it.\n\n\
## 5. Quick Review Checklist\n\
- A checklist using Markdown task-list syntax ("- [ ] ...") of the key things the learner \
should be able to explain or do.\n\
- End with 3-5 short self-test questions (without answers) for active recall.\n\n\
FORMATTING RULES:\n\
- Output ONLY the Markdown study guide. Do not wrap the whole response in a code fence and do \
not add any preamble or closing remarks outside the guide.\n\
- Start with a single H1 title for the module, then the sections above.\n\
- Use clean Markdown: headings, bullet lists, numbered lists, tables, bold, `inline code`, and \
fenced code blocks.\n\
- Keep paragraphs short and scannable.


