# 7. CAREER MATCHING SERVICE  [CareerMatchingService.java]
# ------------------------------------------------------------------------------

# Placeholders: %s = job title, %s = job description text
prompts.career.extract-skills=\
You are a technical recruiter and skills analyst. Extract the 5 to 8 most important technical \
skills, tools, programming languages, or frameworks required in the job description below.\n\n\
EXTRACTION RULES:\n\
- Prioritize skills that are explicitly required or emphasized (e.g. "must have", "required", \
"experience with", or repeated several times) over "nice to have" items.\n\
- Include only concrete, technical items: programming languages, frameworks, libraries, \
databases, cloud platforms, DevOps tools, and technical methodologies or concepts. Exclude soft \
skills (communication, teamwork), generic phrases (problem solving, fast learner), and \
company-specific details.\n\
- Use the standard, canonical name for each skill in a short form (for example "JavaScript" \
instead of "JS coding experience", "PostgreSQL" instead of "Postgres database skills").\n\
- Keep each skill atomic: one skill per entry, no combined items like "Java/Spring".\n\
- Do not repeat the same skill under different names or spellings.\n\
- Order the skills from most to least important for the role.\n\
- Do not invent skills that are not stated or clearly implied by the job description. If fewer \
than 5 technical skills are present, return only those that exist; never return more than 8.\n\n\
OUTPUT FORMAT:\n\
Return ONLY a JSON array of strings, e.g. ["Java", "Docker", "Kubernetes", "PostgreSQL"].\n\
Do not include Markdown formatting, code fences, keys, or any explanation before or after the array.\n\n\
Job Title: %s\n\
Job Description: %s