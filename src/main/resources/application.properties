spring.application.name=StudyGen
# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/studygen}
spring.datasource.username=${DB_USERNAME:user}
spring.datasource.password=${DB_PASSWORD:StudyGen123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=existing_users_table 
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.0-flash